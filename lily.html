<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily, compiled</title>
<style>
/* The scene is a night stage in both light and dark mode */
:root{--bg:#04050c;--glow:#0b1146;--cap:#f1e36a;--dim:rgba(255,255,255,.42);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04050c;--glow:#0b1146}}
:root[data-theme="dark"]{--bg:#04050c;--glow:#0b1146}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(120% 75% at 50% 108%,var(--glow),var(--bg) 62%);font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cap{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 0;text-align:center;color:var(--cap);font-size:15px;letter-spacing:.02em;pointer-events:none}
#hint{position:fixed;bottom:0;left:0;right:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;color:var(--dim);font:12px/1.2 ui-monospace,Menlo,monospace;pointer-events:none}
</style>
</head>
<body>
<div id="cap"></div><div id="hint">drag to rotate, tap to replay</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const TAU=Math.PI*2,clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)},eo=x=>1-Math.pow(1-clamp(x),3);
let S=11;const rnd=()=>{S|=0;S=S+0x6D2B79F5|0;let t=Math.imul(S^S>>>15,1|S);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const LOOP=22;

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.localClippingEnabled=true;
const cv=renderer.domElement;document.body.prepend(cv);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,100),root=new THREE.Group();scene.add(root);
scene.add(new THREE.HemisphereLight(0xcfe0ff,0x1a0a20,.55),new THREE.AmbientLight(0x3a2a55,.5));
const key=new THREE.DirectionalLight(0xfff0e4,1.7);key.position.set(3,5,6);scene.add(key);
const fill_=new THREE.PointLight(0xff5fa8,1.3,14);fill_.position.set(-3,1,3);scene.add(fill_);
const rim=new THREE.PointLight(0x4f7bff,1.6,16);rim.position.set(2.5,2,-4);scene.add(rim);

/* ---------- textures ---------- */
function tex(kind){
 const w=256,h=512,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 if(kind==='leaf'){
  g.fillStyle='#1d6b2c';g.fillRect(0,0,w,h);
  const l=g.createLinearGradient(0,0,w,0);l.addColorStop(0,'rgba(8,46,18,.85)');l.addColorStop(.5,'rgba(130,205,95,.55)');l.addColorStop(1,'rgba(8,46,18,.85)');
  g.fillStyle=l;g.fillRect(0,0,w,h);g.strokeStyle='rgba(210,245,160,.55)';g.lineWidth=3;g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.stroke();
 }else{
  const bud=kind==='bud';
  g.fillStyle=bud?'#d9edc2':kind==='pink'?'#ffe3ef':'#fff8fb';g.fillRect(0,0,w,h);
  let l=g.createLinearGradient(0,0,w,0);
  l.addColorStop(0,'rgba(255,170,205,0)');l.addColorStop(.22,'rgba(245,130,175,.2)');
  l.addColorStop(.5,kind==='pink'?'rgba(232,60,135,.8)':'rgba(238,92,152,.62)');
  l.addColorStop(.78,'rgba(245,130,175,.2)');l.addColorStop(1,'rgba(255,170,205,0)');
  g.fillStyle=l;g.fillRect(0,0,w,h);
  l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,'rgba(255,248,251,.6)');l.addColorStop(.2,'rgba(255,248,251,0)');g.fillStyle=l;g.fillRect(0,0,w,h);
  l=g.createLinearGradient(0,h,0,h*.78);l.addColorStop(0,'rgba(165,215,105,.95)');l.addColorStop(1,'rgba(165,215,105,0)');g.fillStyle=l;g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(190,40,100,.35)';g.lineWidth=2;g.beginPath();g.moveTo(w/2,h*.8);g.lineTo(w/2,h*.1);g.stroke();
  if(!bud)for(let i=0;i<190;i++){
   const t=.1+rnd()*.52,y=(1-t)*h,x=w/2+(rnd()+rnd()-1)*w*.32*(.5+Math.sin(Math.PI*t)),r=1.2+rnd()*2.8;
   g.fillStyle=`rgba(${150+rnd()*45|0},${14+rnd()*30|0},${68+rnd()*32|0},${.55+rnd()*.4})`;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  }
 }
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}
const std=(map,o)=>new THREE.MeshStandardMaterial(Object.assign({map,side:THREE.DoubleSide,roughness:.55,emissive:0x2a0c1c,emissiveIntensity:.35},o));
const M={white:std(tex('white')),pink:std(tex('pink')),bud:std(tex('bud'),{emissive:0x0c2a10}),leaf:std(tex('leaf'),{emissive:0x051a08,roughness:.4}),
 stem:new THREE.MeshStandardMaterial({color:0x2f8a3c,roughness:.5,emissive:0x07240c})};
const wm=c=>new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:0,depthWrite:false});
const W={pink:wm(0xffc2de),green:wm(0x7dffa0)};
const pS=new THREE.Plane(new THREE.Vector3(0,-1,0),-3.4),pW=new THREE.Plane(new THREE.Vector3(0,-1,0),-3.4);
for(const m of Object.values(M))m.clippingPlanes=[pS];
for(const m of Object.values(W))m.clippingPlanes=[pW];
const setOp=(m,v)=>{m.opacity=v;m.transparent=v<.999};

/* ---------- parametric petal surface (rebuilt on CPU each frame while blooming) ---------- */
const NU=18,NV=10,NP=(NU+1)*(NV+1);
const IDX=(()=>{const a=[];for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const p=i*(NV+1)+j,q=p+NV+1;a.push(p,q,p+1,p+1,q,q+1)}return a})();
const UVS=(()=>{const a=new Float32Array(NP*2);for(let i=0;i<=NU;i++)for(let j=0;j<=NV;j++){const k=(i*(NV+1)+j)*2;a[k]=j/NV;a[k+1]=i/NU}return a})();
function surf(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NP*3),3));g.setAttribute('uv',new THREE.BufferAttribute(UVS,2));g.setIndex(IDX);return g}
const mkP=o=>Object.assign({g:surf(),ruf:.6,seed:rnd()*6,u0:.9,u1:.35,c0:-.7,c1:1.05,o0:.34,o1:.85},o);
function fill(P,b){
 const pos=P.g.attributes.position.array,open=lerp(P.o0,P.o1,b),curl=lerp(P.c0,P.c1,b),cup=lerp(P.u0,P.u1,b),dl=P.len/NU,ca=Math.cos(P.az),sa=Math.sin(P.az);
 let y=0,z=0,k=0;
 for(let i=0;i<=NU;i++){
  const u=i/NU;
  if(i){const tm=open+curl*Math.pow((i-.5)/NU,2.2);y+=Math.cos(tm)*dl;z+=Math.sin(tm)*dl}
  const th=open+curl*Math.pow(u,2.2),s=Math.sin(th),c=Math.cos(th);
  const pr=Math.pow(Math.sin(Math.PI*Math.pow(u,.72)),.8),w=P.wid*(pr*.92+.08*(1-u));
  for(let j=0;j<=NV;j++){
   const v=-1+2*j/NV,v2=v*v,x=v*w,cu=cup*v2*P.wid*(1-u*.7),rf=P.ruf*Math.sin(u*13+P.seed+v*2.2)*v2*P.wid*.3*u;
   const py=y+(cu-rf)*s,pz=z+(rf-cu)*c;
   pos[k++]=x*ca+pz*sa;pos[k++]=py;pos[k++]=-x*sa+pz*ca;
  }
 }
 P.g.attributes.position.needsUpdate=true;P.g.computeVertexNormals();
}

/* ---------- flowers ---------- */
function mkFlower(d){
 const g=new THREE.Group();g.position.set(...d.pos);g.scale.setScalar(d.s);root.add(g);
 const bud=!!d.bud,f={g,d,petals:[],bloom:-1,ph:rnd()*6,stamen:()=>{}};
 for(let i=0;i<6;i++){
  const n=i%2,P=mkP({az:i*TAU/6,len:(bud?1:1.22)*(n?.96:1)*(.96+rnd()*.08),wid:n?.31:.25,o0:n?.3:.38,o1:n?.72:.88,c1:n?1:1.12,ruf:n?.9:.5});
  const a=new THREE.Mesh(P.g,M[d.tex]),b=new THREE.Mesh(P.g,W.pink);a.frustumCulled=b.frustumCulled=false;g.add(a,b);f.petals.push(P);
 }
 if(!bud){
  const sg=new THREE.Group();g.add(sg);
  const fm=new THREE.MeshStandardMaterial({color:0xeaf2c8,roughness:.6}),am=new THREE.MeshStandardMaterial({color:0x7a2f14,roughness:.7,emissive:0x3b1204}),gm=new THREE.MeshStandardMaterial({color:0xb8dc86,roughness:.5}),fil=[];
  for(let i=0;i<7;i++){
   const pist=i===6,len=pist?1.15:.95+rnd()*.12;
   const m=new THREE.Mesh(new THREE.CylinderGeometry(.006,pist?.016:.011,len,5).translate(0,len/2,0),pist?gm:fm);
   m.rotation.order='YXZ';m.userData={az:pist?0:i*TAU/6+.5,pist,ph:rnd()*6};
   const t=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),pist?gm:am);t.position.y=len;
   if(!pist){t.scale.set(.5,2.6,.5);t.rotation.z=(i%2?1:-1)*1.25}
   m.add(t);sg.add(m);fil.push(m);
  }
  f.stamen=(b,op)=>{sg.visible=op>.01;for(const m of [fm,am,gm])setOp(m,op);
   for(const m of fil){const u=m.userData;m.rotation.x=u.pist?.1+.15*b:lerp(.05,.5,b)+.05*Math.sin(u.ph);m.rotation.y=u.az}};
 }
 f.set=b=>{if(Math.abs(b-f.bloom)>1e-4){f.bloom=b;for(const P of f.petals)fill(P,b)}};
 f.set(0);g.updateMatrix();return f;
}
const FD=[
 {pos:[.1,1.72,0],rx:.5,ry:.4,rz:0,s:1,tex:'white',st:8.8},
 {pos:[-1.25,.2,.1],rx:.35,ry:.2,rz:1.05,s:.9,tex:'pink',st:9.7},
 {pos:[1.2,-.95,-.1],rx:.3,ry:-.3,rz:-1,s:.85,tex:'white',st:10.5},
 {pos:[.55,.62,.05],rx:.1,ry:0,rz:-.35,s:.72,tex:'bud',bud:1},
 {pos:[-.35,-1.5,.05],rx:.1,ry:1,rz:.5,s:.6,tex:'bud',bud:1}
];
const flowers=FD.map(mkFlower);

/* ---------- stem, pedicels, leaves (static) ---------- */
const V=a=>new THREE.Vector3(...a),st=[];
function stat(geo,mat,w,pos,ry){
 const h=new THREE.Group();h.position.set(...pos);h.rotation.y=ry||0;h.updateMatrix();
 const a=new THREE.Mesh(geo,mat),b=new THREE.Mesh(geo,w);a.frustumCulled=b.frustumCulled=false;h.add(a,b);root.add(h);
 const p=geo.attributes.position,v=new THREE.Vector3(),arr=new Float32Array(p.count*3);
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(h.matrix);arr.set([v.x,v.y,v.z],i*3)}
 st.push(arr);
}
const stemC=new THREE.CatmullRomCurve3([[0,-3.2,0],[.06,-2.2,.04],[-.06,-1,.05],[.02,.2,-.03],[.1,1,0],[.1,1.72,0]].map(V));
stat(new THREE.TubeGeometry(stemC,80,.055,7,false),M.stem,W.green,[0,0,0]);
for(const p of [
 [[0,.15,0],[-.5,.28,.1],[-.95,.3,.12],[-1.2,.22,.1]],
 [[.01,-.7,0],[.5,-.65,-.05],[.95,-.78,-.1],[1.2,-.95,-.1]],
 [[.03,.35,0],[.3,.5,.03],[.55,.62,.05]],
 [[0,-1.2,0],[-.15,-1.35,.05],[-.35,-1.5,.05]]
])stat(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p.map(V)),28,.03,6,false),M.stem,W.green,[0,0,0]);
for(let i=0;i<9;i++){
 const tt=.06+i*.09,P=mkP({az:0,len:1.5-.9*tt,wid:.1+.05*(1-tt),o0:.9-.2*tt,o1:.9-.2*tt,c0:1.2,c1:1.2,u0:.45,u1:.45,ruf:.5});
 fill(P,0);const p=stemC.getPointAt(tt);stat(P.g,M.leaf,W.green,[p.x,p.y,p.z],i*2.39996);
}

/* ---------- point cloud (vertices of everything) ---------- */
const ND=flowers.length*6*NP,N=ND+st.reduce((a,b)=>a+b.length/3,0);
const tgt=new Float32Array(N*3),sc=new Float32Array(N*3),cb=new Float32Array(N*3),cl=new Float32Array(N*3),pp=new Float32Array(N*3),del=new Float32Array(N),ph=new Float32Array(N);
function dyn(){let k=0;for(const f of flowers){const e=f.g.matrix.elements;for(const P of f.petals){const s=P.g.attributes.position.array;
 for(let i=0;i<s.length;i+=3,k+=3){const x=s[i],y=s[i+1],z=s[i+2];tgt[k]=e[0]*x+e[4]*y+e[8]*z+e[12];tgt[k+1]=e[1]*x+e[5]*y+e[9]*z+e[13];tgt[k+2]=e[2]*x+e[6]*y+e[10]*z+e[14]}}}}
dyn();{let o=ND*3;for(const a of st){tgt.set(a,o);o+=a.length}}
for(let i=0;i<N;i++){
 const j=i*3,green=i>=ND,bud=!green&&FD[Math.floor(i/(6*NP))].bud;
 del[i]=clamp((tgt[j+1]+3.4)/6.6,0,1)*.43+rnd()*.12;ph[i]=rnd()*TAU;
 let dx=rnd()+rnd()+rnd()-1.5,dy=rnd()+rnd()+rnd()-1.5,dz=rnd()+rnd()+rnd()-1.5;const m=Math.hypot(dx,dy,dz)||1,r=.8+rnd()*3.8;
 sc[j]=tgt[j]+dx/m*r;sc[j+1]=tgt[j+1]+dy/m*r;sc[j+2]=tgt[j+2]+dz/m*r;
 if(green){const q=.7+.3*rnd();cb.set([.4*q,1*q,.55*q],j)}else if(bud)cb.set([.7,1,.75],j);else{const q=Math.pow(rnd(),2);cb.set([1,lerp(.85,.45,q),lerp(.92,.7,q)],j)}
}
const dotT=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.35,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));pg.setAttribute('color',new THREE.BufferAttribute(cl,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.05,map:dotT,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
pts.frustumCulled=false;root.add(pts);

/* ---------- ambience: dust, glow, ground ring ---------- */
const dp=new Float32Array(260*3);for(let i=0;i<260;i++){dp[i*3]=(rnd()-.5)*12;dp[i*3+1]=(rnd()-.5)*10;dp[i*3+2]=(rnd()-.5)*5-1}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dg,new THREE.PointsMaterial({size:.035,map:dotT,color:0x9fb8ff,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(dust);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:dotT,color:0xff5fa8,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));glow.scale.set(9,9,1);glow.position.set(0,.5,-2);scene.add(glow);
const rp=[];for(let i=0;i<64;i++){const a=i/64*TAU;rp.push(Math.cos(a)*1.4,-3.22,Math.sin(a)*1.4)}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(rp,3));
root.add(new THREE.LineLoop(rg,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.22})));

/* ---------- camera / input ---------- */
function resize(){
 const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
 const t=Math.tan(cam.fov*Math.PI/360),d=Math.max(3.6/t,2.7/(t*cam.aspect));
 cam.position.set(0,d*.17,d);cam.lookAt(0,-.05,0);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
let yaw=0,vyaw=0,drag=null,t0=performance.now()/1000;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,t:performance.now(),m:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;drag.m+=Math.abs(dx);vyaw=dx*.008;yaw+=vyaw});
cv.addEventListener('pointerup',()=>{if(drag&&drag.m<6&&performance.now()-drag.t<350)t0=performance.now()/1000;drag=null});

/* ---------- main loop ---------- */
const capEl=document.getElementById('cap'),CAP=[[0,'initializing particles…'],[3.2,'compiling vertices…'],[6.4,'building mesh…'],[9,'Something beautiful gets compiled. 🌷'],[18.4,'garbage collected.']];let capI=-1;
function frame(){
 requestAnimationFrame(frame);
 const now=performance.now()/1000,L=(now-t0)%LOOP;
 const A=L<18.4?sm(L/5.4):1-sm((L-18.4)/3.4);
 pW.constant=L>18?9:lerp(-3.4,4.2,sm((L-3.2)/3.4));pS.constant=L>18?9:lerp(-3.4,4.4,sm((L-4.4)/3.4));
 const solid=1-sm((L-18.6)/2.4),wire=.85*sm((L-3.2)/.8)*(1-sm((L-7.6)/2.2))+.75*sm((L-18.2)/.6)*(1-sm((L-19.2)/2));
 for(const m of Object.values(M))setOp(m,solid);for(const m of Object.values(W))setOp(m,wire);
 const fade=1-sm((L-17.6)/3.2);
 for(const f of flowers){
  const d=f.d,b=d.bud?.1*sm((L-9)/8)*fade:sm((L-d.st)/4.2)*fade;
  f.set(b);f.g.rotation.set(d.rx+Math.sin(now*.6+f.ph)*.03,d.ry,d.rz+Math.cos(now*.5+f.ph)*.03,'YXZ');f.g.updateMatrix();
  f.stamen(b,clamp((b-.2)*2.5)*solid);
 }
 const showP=L<10||L>18;pts.visible=showP;
 if(showP){
  dyn();const c=Math.cos(now*.25),s=Math.sin(now*.25),cS=pS.constant;
  for(let i=0,j=0;i<N;i++,j+=3){
   const p=eo((A-del[i])/.45),sx=sc[j]*c+sc[j+2]*s,sz=-sc[j]*s+sc[j+2]*c,sy=sc[j+1]+Math.sin(now*.9+ph[i])*.1;
   pp[j]=lerp(sx,tgt[j],p);pp[j+1]=lerp(sy,tgt[j+1],p);pp[j+2]=lerp(sz,tgt[j+2],p);
   const k=L<12?clamp((tgt[j+1]-cS)/1.1):1-solid;cl[j]=cb[j]*k;cl[j+1]=cb[j+1]*k;cl[j+2]=cb[j+2]*k;
  }
  pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;
 }
 glow.material.opacity=.2*sm((L-6)/4)*solid;
 if(!drag){yaw+=vyaw;vyaw*=.95}
 root.rotation.y=now*.2+yaw;dust.rotation.y=now*.02;
 let ci=0;for(let i=0;i<CAP.length;i++)if(L>=CAP[i][0])ci=i;
 if(ci!==capI){capI=ci;capEl.textContent=CAP[ci][1]}
 renderer.render(scene,cam);
}
frame();
})();
</script>
</body>
</html>
